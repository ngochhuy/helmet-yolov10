extends: base.yaml

experiment:
  id: E4
  name: tiled_inference
  description: YOLOv10n inference on overlapping 640x640 tiles for small objects

tiled_inference:
  tile_size: [640, 640] # Mỗi tile = 640×640 (đúng bằng input size của model)
  overlap_candidates: [0.20, 0.25, 0.30]  # Thử 3 mức overlap: 20%, 25%, 30%
  confidence_threshold: 0.001  
  merge_iou_threshold: 0.7 # NMS: box trùng >70% IoU → gộp lại
  merge_method: class_aware_nms # NMS theo từng class (tránh nhầm lớp)
  selection_split: val # Chọn overlap tốt nhất trên val, KHÔNG dùng test
  selection_metric: metrics/mAP50-95(B)

output:
  root: experiments/E4_tiled_inference
