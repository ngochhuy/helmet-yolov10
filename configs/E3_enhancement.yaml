extends: base.yaml

experiment:
  id: E3
  name: low_light_enhancement
  description: Validation-selected low-light enhancement before E1 inference

# Select the method on the low-light validation subset only. Do not alter this
# configuration from test-set results. The notebook records the selected method
# in experiments/E3/ before test evaluation.
enhancement:
  selection_split: val # Chọn method trên val set, KHÔNG được dùng test set
  selection_metric: metrics/mAP50-95(B)
  candidates:
    clahe:
      color_space: LAB # Chuyển ảnh sang không gian màu LAB
      channel: L # Chỉ enhance kênh L (độ sáng), giữ màu sắc
      clip_limit: 2.0 # Giới hạn tương phản cục bộ (tránh khuếch đại noise)
      tile_grid_size: [8, 8] # Chia ảnh thành 8×8 ô để enhance cục bộ
    gamma: # Phương pháp 2: Gamma Correction
      # output = 255 * (input / 255) ** gamma; gamma < 1 brightens images.
      gamma: 0.7 # < 1 → làm sáng ảnh (output = 255*(input/255)^0.7)

output:
  root: experiments/E3_enhancement
