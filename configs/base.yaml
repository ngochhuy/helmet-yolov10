model:
  architecture: YOLOv10n
  weights: weights/yolov10n.pt
  pretrained_source: https://github.com/THU-MIG/yolov10/releases/download/v1.1/yolov10n.pt

training:
  data: configs/data.yaml
  imgsz: 640
  epochs: 100
  batch: 4
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 20
  seed: 42
  deterministic: true
  pretrained: true
  amp: true
  device: 0
  workers: 8
  cache: false
  save: true
  save_period: -1
  plots: true
  val: true

  # Standard augmentation in the official YOLOv10 training recipe. E1 adds no
  # project-specific low-light, noise or blur augmentation.
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 10

evaluation:
  split: test
  imgsz: 640
  batch: 16
  conf: 0.001
  iou: 0.7
  max_det: 300
  half: false
  plots: true

output:
  root: experiments
